 procedimientos de declaración de lesividad."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Reglamentos Orgánicos del Ayuntamiento de Bilbao", "articulo": "Estructura ejecutiva, áreas municipales y organización del Ayuntamiento de Bilbao", "explicacion": "Respuesta oficial de la plantilla de corrección: Opción D) \"Las propuestas de resolución en los procedimientos de declaración de lesividad.\"."}}, {"numero": 141, "tema_id": 5, "tema_title": "Tema 5: Ley 39/2015, de Procedimiento Administrativo Común de las Administraciones Públicas", "origen": "Batería Oficial Ayuntamiento de Bilbao - Temario General (Pregunta #141)", "estado": "Vigente", "pregunta": "LA LEY 39/2015, DE 1 DE OCTUBRE, DEL PROCEDIMIENTO ADMINISTRATIVO COMÚN DE LAS ADMINISTRACIONES PÚBLICAS ENTRÓ EN VIGOR:", "opciones": {"A": "Al día siguiente de su publicación en el Boletín Oficial del Estado.", "B": "A los 20 días de su publicación en el Boletín Oficial del Estado.", "C": "A los 6 meses de su publicación en el Boletín Oficial del Estado.", "D": "Al año de su publicación en el Boletín Oficial del Estado."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas", "articulo": "Actos y procedimiento administrativo común", "explicacion": "Respuesta oficial de la plantilla de corrección: Opción D) \"Al año de su publicación en el Boletín Oficial del Estado.\"."}}, {"numero": 142, "tema_id": 5, "tema_title": "Tema 5: Ley 39/2015, de Procedimiento Administrativo Común de las Administraciones Públicas", "origen": "Batería Oficial Ayuntamiento de Bilbao - Temario General (Pregunta #142)", "estado": "Vigente", "pregunta": "LA LEY 39/2015, DE PROCEDIMIENTO ADMINISTRATIVO COMÚN, ESTABLECE QUE REGLAMENTARIAMENTE PODRÁN ESTABLECERSE ESPECIALIDADES DEL PROCEDIMIENTO. ¿A QUE ESPECIALIDADES PUEDE REFERIRSE?", "opciones": {"A": "A los órganos competentes.", "B": "A plazos propios del concreto procedimiento por razón de la materia.", "C": "A formas de iniciación y terminación.", "D": "A todas ellas, así como a la publicación e informes a recabar."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas", "articulo": "Actos y procedimiento administrativo común", "explicacion": "Respuesta oficial de la plantilla de corrección: Opción D) \"A todas ellas, así como a la publicación e informes a recabar.\"."}}, {"numero": 143, "tema_id": 5, "tema_title": "Tema 5: Ley 39/2015, de Procedimiento Administrativo Común de las Administraciones Públicas", "origen": "Batería Oficial Ayuntamiento de Bilbao - Temario General (Pregunta #143)", "estado": "Vigente", "pregunta": "DE ACUERDO CON LA LEY 39/2015, DE PROCEDIMIENTO ADMINISTRATIVO COMÚN, ¿CUÁL DE LAS SIGUIENTES ALTERNATIVAS FORMA PARTE DEL SECTOR PÚBLICO?", "opciones": {"A": "La Administración General del Estado.", "B": "Las Administraciones de las Comunidades Autónomas.", "C": "Las Entidades que integran la Administración Local.", "D": "Todas ellas conforman, entre otras, el Sector Público a efectos de la Ley indicada."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas", "articulo": "Actos y procedimiento administrativo común", "explicacion": "Respuesta oficial de la plantilla de corrección: Opción D) \"Todas ellas conforman, entre otras, el Sector Público a efectos de la Ley indicada.\"."}}, {"numero": 144, "tema_id": 5, "tema_title": "Tema 5: Ley 39/2015, de Procedimiento Administrativo Común de las Administraciones Públicas", "origen": "Batería Oficial Ayuntamiento de Bilbao - Temario General (Pregunta #144)", "estado": "Vigente", "pregunta": "SEGÚN LA LEY 39/2015, DE PROCEDIMIENTO ADMINISTRATIVO COMÚN, ¿CUÁL DE LOS SIGUIENTES NO TIENE LA CONSIDERACIÓN DE INTERESADO EN EL PROCEDIMIENTO ADMINISTRATIVO?", "opciones": {"A": "Quienes lo promuevan como titulares de derechos o intereses legítimos individuales o colectivos.", "B": "Aquellos cuyos intereses legítimos, individuales o colectivos, puedan resultar afectados por la resolución y se personen en el procedimiento en tanto no haya recaído resolución definitiva.", "C": "Los que, sin haber iniciado el procedimiento, tengan derechos que puedan resultar afectados por la instrucción que en el mismo se adopte y comparezcan, exclusivamente de forma personal, ante la autoridad competente.", "D": "Todas las respuestas son incorrectas."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas", "articulo": "Actos y procedimiento administrativo común", "explicacion": "Respuesta oficial de la plantilla de corrección: Opción C) \"Los que, sin haber iniciado el procedimiento, tengan derechos que puedan resultar afectados por la instrucción que en el mismo se adopte y comparezcan, exclusivamente de forma personal, ante la autoridad competente.\"."}}, {"numero": 145, "tema_id": 5, "tema_title": "Tema 5: Ley 39/2015, de Procedimiento Administrativo Común de las Administraciones Públicas", "origen": "Batería Oficial Ayuntamiento de Bilbao - Temario General (Pregunta #145)", "estado": "Vigente", "pregunta": "DE ACUERDO CON LA LEY 39/2015, DE PROCEDIMIENTO ADMINISTRATIVO COMÚN, SI DURANTE LA INSTRUCCIÓN DE UN PROCEDIMIENTO QUE NO HAYA TENIDO PUBLICIDAD, SE ADVIERTE LA EXISTENCIA DE PERSONAS QUE SEAN TITULARES DE DERECHOS O INTERESES LEGÍTIMOS Y DIRECTOS CUYA IDENTIFICACIÓN RESULTE DEL EXPEDIE NTE Y QUE PUEDAN RESULTAR AFECTADOS POR LA RESOLUCIÓN QUE SE DICTE:", "opciones": {"A": "Se continuará con la tramitación del procedimiento.", "B": "Se comunicará a dichas personas la tramitación del procedimiento.", "C": "Se notificará en legal forma a todos los interesados en el procedimiento.", "D": "Las respuestas a) y c) son correctas."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas", "articulo": "Actos y procedimiento administrativo común", "explicacion": "Respuesta oficial de la plantilla de corrección: Opción B) \"Se comunicará a dichas personas la tramitación del procedimiento.\"."}}, {"numero": 146, "tema_id": 5, "tema_title": "Tema 5: Ley 39/2015, de Procedimiento Administrativo Común de las Administraciones Públicas", "origen": "Batería Oficial Ayuntamiento de Bilbao - Temario General (Pregunta #146)", "estado": "Vigente", "pregunta": "SEGÚN LA LEY 39/2015 DE PROCEDIMIENTO ADMINISTRATIVO COMÚN , CON RESPECTO A LA ORDENACIÓN DEL PROCEDIMIENTO, CUANDO EN VIRTUD DE UNA NORMA SEA PRECISO REMITIR EL EXPEDIENTE ELECTRÓNICO:", "opciones": {"A": "Se hará de acuerdo a las características y medios disponible s del empleado público que lo tramite.", "B": "No es necesario en su tramitación que vaya acompañado del índice.", "C": "Se hará de acuerdo con lo previsto en el Esquema Nacional de Interoperabilidad y en las correspondientes normas técnicas de la Interoperabilidad y se enviará completo, foliado, autentificado y acompañado de un índice, así mismo autenticado, de los d ocumentos que contenga.", "D": "Ninguna de las respuestas anteriores es correcta."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas", "articulo": "Actos y procedimiento administrativo común", "explicacion": "Respuesta oficial de la plantilla de corrección: Opción C) \"Se hará de acuerdo con lo previsto en el Esquema Nacional de Interoperabilidad y en las correspondientes normas técnicas de la Interoperabilidad y se enviará completo, foliado, autentificado y acompañado de un índice, así mismo autenticado, de los d ocumentos que contenga.\"."}}, {"numero": 147, "tema_id": 5, "tema_title": "Tema 5: Ley 39/2015, de Procedimiento Administrativo Común de las Administraciones Públicas", "origen": "Batería Oficial Ayuntamiento de Bilbao - Temario General (Pregunta #147)", "estado": "Vigente", "pregunta": "SEGÚN LA LEY 39/2015, DE PROCEDIMIENTO ADMINISTRATIVO COMÚN DE LAS ADMINISTRACIONES PÚBLICAS, PONDRÁN FIN AL PROCEDIMIENTO:", "opciones": {"A": "La Resolución y el Desistimiento.", "B": "La imposibilidad material de continuarlo por causas sobrevenidas. La resolución que se dicte deberá ser motivada en todo caso.", "C": "La renuncia al derecho en el que se funde la solicitud, cuando tal renuncia no esté prohibida por el ordenamiento jurídico y la declaración de caducidad.", "D": "Todas las respuestas son correctas."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas", "articulo": "Actos y procedimiento administrativo común", "explicacion": "Respuesta oficial de la plantilla de corrección: Opción D) \"Todas las respuestas son correctas.\"."}}, {"numero": 148, "tema_id": 5, "tema_title": "Tema 5: Ley 39/2015, de Procedimiento Administrativo Común de las Administraciones Públicas", "origen": "Batería Oficial Ayuntamiento de Bilbao - Temario General (Pregunta #148)", "estado": "Vigente", "pregunta": "¿EN QUÉ ARTÍCULO DE LA LEY 39/2015, DE PROCEDIMIENTO ADMINISTRATIVO COMÚN , CON RESPECTO A LA  INSTRUCCIÓN DEL PROCEDIMIENTO, SE REGULAN LOS ACTOS DE INSTRUCCIÓN DEL PROCEDIMIENTO?", "opciones": {"A": "Artículo 70.", "B": "Artículo 75.", "C": "Artículo 78.", "D": "Artículo 84."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas", "articulo": "Actos y procedimiento administrativo común", "explicacion": "Respuesta oficial de la plantilla de corrección: Opción B) \"Artículo 75.\"."}}, {"numero": 149, "tema_id": 5, "tema_title": "Tema 5: Ley 39/2015, de Procedimiento Administrativo Común de las Administraciones Públicas", "origen": "Batería Oficial Ayuntamiento de Bilbao - Temario General (Pregunta #149)", "estado": "Vigente", "pregunta": "SEGÚN LA LEY 39/2015, DE PROCEDIMIENTO ADMINISTRATIVO COMÚN , ¿EN QUE MOMENTO DEL PROCEDIMIENTO PUEDEN ELEGIR LAS PERSONAS FÍSICAS SI SE COMUNICAN CON LAS ADMINISTRACIONES PÚBLICAS PARA EL EJERCICIO DE SUS DERECHOS Y OBLIGACIONES A TRAVÉS DE MEDIOS ELECTRÓNICOS?", "opciones": {"A": "Mientras el procedimiento se encuentre en la fase de ordenación.", "B": "Antes de la finalización de la instrucción.", "C": "Antes del trámite de audiencia.", "D": "En todo momento."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas", "articulo": "Actos y procedimiento administrativo común", "explicacion": "Respuesta oficial de la plantilla de corrección: Opción D) \"En todo momento.\"."}}, {"numero": 150, "tema_id": 5, "tema_title": "Tema 5: Ley 39/2015, de Procedimiento Administrativo Común de las Administraciones Públicas", "origen": "Batería Oficial Ayuntamiento de Bilbao - Temario General (Pregunta #150)", "estado": "Vigente", "pregunta": "SEGÚN LA LEY 39/2015, DE PROCEDIMIENTO ADMINISTRATIVO COMÚN , COMO REGLA GENERAL, SEÑALE EN QUE LENGUA SE TRAMITARÁN LOS PROCEDIMIENTOS ADMINISTRATIVOS POR PARTE DE LAS ENTIDADES LOCALES:", "opciones": {"A": "En castellano.", "B": "En castellano y las demás lenguas cooficiales.", "C": "En este supuesto el uso de la lengua se ajustará a lo previsto en la legislación autonómica correspondiente.", "D": "En este supuesto el uso de la lengua será elegido por la Entidad Local."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas", "articulo": "Actos y procedimiento administrativo común", "explicacion": "Respuesta oficial de la plantilla de corrección: Opción C) \"En este supuesto el uso de la lengua se ajustará a lo previsto en la legislación autonómica correspondiente.\"."}}, {"numero": 151, "tema_id": 5, "tema_title": "Tema 5: Ley 39/2015, de Procedimiento Administrativo Común de las Administraciones Públicas", "origen": "Batería Oficial Ayuntamiento de Bilbao - Temario General (Pregunta #151)", "estado": "Vigente", "pregunta": "SEGÚN LA LEY 39/2015, DE PROCEDIMIENTO ADMINISTRATIVO COMÚN , LOS REGISTROS ELECTRÓNICOS DE TODAS Y CADA UNA DE LAS ADMINISTRACIONES, DEBEN CUMPLIR UNA CARACTERÍSTICA FUNDAMENTAL:", "opciones": {"A": "Que sean técnicamente intercambiables, de modo que se garantice su compatibilidad informática e interconexión, así como la transmisión telemática de los asientos registrales y de los documentos que se presenten en cualquiera de los registros.", "B": "Que deberán ser plenamente interoperables, de modo que se garantice su compatibilidad informática e interconexión, así como la transmisión telemática de los asientos registrales y de los documentos que se presenten en cualquiera de los registros.", "C": "Que sean plenamente interoperables, con independencia de su compatibilidad informática.", "D": "Que estén normalizados."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas", "articulo": "Actos y procedimiento administrativo común", "explicacion": "Respuesta oficial de la plantilla de corrección: Opción B) \"Que deberán ser plenamente interoperables, de modo que se garantice su compatibili s Públicas", "articulo": "Actos y procedimiento administrativo común", "explicacion": "Respuesta oficial de la plantilla de corrección: Opción A) \"Los actos firmes en vía administrativa.\"."}}, {"numero": 173, "tema_id": 5, "tema_title": "Tema 5: Ley 39/2015, de Procedimiento Administrativo Común de las Administraciones Públicas", "origen": "Batería Oficial Ayuntamiento de Bilbao - Temario General (Pregunta #173)", "estado": "Vigente", "pregunta": "CUÁL DE LAS SIGUIENTES NO ES CAUSA DE INADMISIÓN DE UN RECURSO ADMINISTRATIVO:", "opciones": {"A": "El error o la ausencia de la calificación del recurso por parte del recurrente siempre que se deduzca su verdadero carácter.", "B": "Carecer de legitimación el recurrente.", "C": "Carecer el recurso manifiestamente de fundamento.", "D": "Ser incompetente el órgano administrativo, cuando el competente perteneciera a otra Administración Pública."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas", "articulo": "Actos y procedimiento administrativo común", "explicacion": "Respuesta oficial de la plantilla de corrección: Opción A) \"El error o la ausencia de la calificación del recurso por parte del recurrente siempre que se deduzca su verdadero carácter.\"."}}, {"numero": 174, "tema_id": 5, "tema_title": "Tema 5: Ley 39/2015, de Procedimiento Administrativo Común de las Administraciones Públicas", "origen": "Batería Oficial Ayuntamiento de Bilbao - Temario General (Pregunta #174)", "estado": "Vigente", "pregunta": "EN LOS PROCEDIMIENTOS INICIADOS A SOLICITUD DEL INTERESADO, CUANDO SE PRODUZCA SU PARALIZACIÓN POR CAUSA IMPUTABLE AL MISMO, LA ADMINISTRACIÓN LE ADVERTIRÁ QUE:", "opciones": {"A": "Transcurridos dos meses se producirá la caducidad del procedimiento.", "B": "Transcurridos tres meses se producirá la caducidad del procedimiento.", "C": "Transcurridos seis meses se producirá R INDIVIDUAL:", "opciones": {"A": "A la inamovilidad en la condición de funcionario de carrera.", "B": "Al desempeño eficaz y eficiente de las funciones y de las tareas propias de su condición profesional.", "C": "A la progresión en la carrera vertical y promoción interna en los términos establecidos en esta ley.", "D": "Ninguna de las anteriores es correcta."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Ley 11/2022, de 1 de diciembre, de Empleo Público Vasco", "articulo": "Estatuto y régimen disciplinario del personal empleado público vasco", "explicacion": "Respuesta oficial de la plantilla de corrección: Opción A) \"A la inamovilidad en la condición de funcionario de carrera.\"."}}, {"numero": 177, "tema_id": 6, "tema_title": "Tema 6: Ley 11/2022 de Empleo Público Vasco. Retribuciones, derechos, deberes, incompatibilidades y régimen disciplinario", "origen": "Batería Oficial Ayuntamiento de Bilbao - Temario General (Pregunta #177)", "estado": "Vigente", "pregunta": "DE ACUERDO CON EL ARTÍCULO 161 DE LA LEY 11/2022, DE 1 DE DICIEMBRE, DE EMPLEO PÚBLICO VASCO, EL PERSONAL EMPLEADO PÚBLICO VASCO TIENE LOS SIGUIENTES DERECHOS DE CARÁCTER INDIVIDUAL:", "opciones": {"A": "A ser informado por sus jefes inmediatos de los fines, organización y funcionamiento de la unidad administrativa correspondiente y, en especial, de su dependencia jerárquica y de las atribuciones, deberes y responsabilidades que le incumben.", "B": "A ser informado por sus jefes inmediatos de los fines, organización y funcionamiento de la unidad administrativa correspondiente pero sin atender a su dependencia jerárquica, ni a las atribuciones, ni deberes y responsabilidades que le incumben.", "C": "A ser informado por sus jefes inmediatos de los fines, organización y funcionamiento de la unidad administrativa correspondiente y, en especial, de su independencia jerárquica y de las atribuciones, deberes y responsabilidades que le incumben.", "D": "Ninguna de las anteriores es correcta."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Ley 11/2022, de 1 de diciembre, de Empleo Público Vasco", "articulo": "Estatuto y régimen disciplinario del personal empleado público vasco", "explicacion": "Respuesta oficial de la plantilla de corrección: Opción A) \"A ser informado por sus jefes inmediatos de los fines, organización y funcionamiento de la unidad administrativa correspondiente y, en especial, de su dependencia jerárquica y de las atribuciones, deberes y responsabilidades que le incumben.\"."}}, {"numero": 178, "tema_id": 6, "tema_title": "Tema 6: Ley 11/2022 de Empleo Público Vasco. Retribuciones, derechos, deberes, incompatibilidades y régimen disciplinario", "origen": "Batería Oficial Ayuntamiento de Bilbao - Temario General (Pregunta #178)", "estado": "Vigente", "pregunta": "DE ACUERDO CON EL ARTÍCULO 164 DE LA LEY 11/2022, DE 1 DE DICIEMBRE, DE EMPLEO PÚBLICO VASCO, EL PERSONAL FUNCIONARIO, TENDRÁ DERECHO A DISFRUTAR:", "opciones": {"A": "Durante cada año natural, de unas vacaciones retribuidas de veintidós días hábiles, o de los días que correspondan proporcionalmente si el tiempo de servicio durante el año fue menor.", "B": "Durante cada año natural, de unas vacaciones retribuidas de treinta días naturales, o de los días que correspondan proporcionalmente si el tiempo de servicio durante el año fue menor.", "C": "Durante cada año natural, de unas vacaciones no retribuidas de veintidós días hábiles, o de los días que correspondan proporcionalmente si el tiempo de servicio durante el año fue menor.", "D": "Durante cada año natural, de unas vacaciones no retribuidas de treinta días naturales, o de los días que correspondan proporcionalmente si el tiempo de servicio durante el año fue menor."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Ley 11/2022, de 1 de diciembre, de Empleo Público Vasco", "articulo": "Estatuto y régimen disciplinario del personal empleado público vasco", "explicacion": "Respuesta oficial de la plantilla de corrección: Opción A) \"Durante cada año natural, de unas vacaciones retribuidas de veintidós días hábiles, o de los días que correspondan proporcionalmente si el tiempo de servicio durante el año fue menor.\"."}}, {"numero": 179, "tema_id": 6, "tema_title": "Tema 6: Ley 11/2022 de Empleo Público Vasco. Retribuciones, derechos, deberes, incompatibilidades y régimen disciplinario", "origen": "Batería Oficial Ayuntamiento de Bilbao - Temario General (Pregunta #179)", "estado": "Vigente", "pregunta": "DE ACUERDO CON EL ARTÍCULO 163 DE LA LEY 11/2022, DE 1 DE DICIEMBRE, DE EMPLEO PÚBLICO VASCO, AL PERSONAL FUNCIONARIO DE CARRERA O INTERINO DE LAS ADMINISTRACIONES PÚBLICAS VASCAS QUE SEA NOMBRADO PERSONAL FUNCIONARIO EN PRÁCTICAS EN CUALQUIER OTRA ADMINISTRACIÓN PÚBLICA:", "opciones": {"A": "Se le concederá un permiso sin retribución durante el tiempo que dure el curso selectivo o el periodo de prácticas, sin perjuicio de las retribuciones que tenga derecho a percibir con cargo a la administración en la que aspire a ingresar.", "B": "Se le concederá un permiso retribuido durante el tiempo que dure el curso selectivo o el periodo de prácticas, sin perjuicio de las retribuciones que tenga derecho a percibir con cargo a la administración en la que aspire a ingresar.", "C": "Se le concederá un permiso sin retribución durante el tiempo que dure el curso selectivo o el periodo de prácticas, incompatible con las retribuciones que tenga derecho a percibir con cargo a la administración en la que aspire a ingresar.", "D": "Ninguna de las anteriores es correcta."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Ley 11/2022, de 1 de diciembre, de Empleo Público Vasco", "articulo": "Estatuto y régimen disciplinario del personal empleado público vasco", "explicacion": "Respuesta oficial de la plantilla de corrección: Opción A) \"Se le concederá un permiso sin retribución durante el tiempo que dure el curso selectivo o el periodo de prácticas, sin perjuicio de las retribuciones que tenga derecho a percibir con cargo a la administración en la que aspire a ingresar.\"."}}, {"numero": 180, "tema_id": 6, "tema_title": "Tema 6: Ley 11/2022 de Empleo Público Vasco. Retribuciones, derechos, deberes, incompatibilidades y régimen disciplinario", "origen": "Batería Oficial Ayuntamiento de Bilbao - Temario General (Pregunta #180)", "estado": "Vigente", "pregunta": "DE ACUERDO CON EL ARTÍCULO 165 DE LA LEY 11/2022, DE 1 DE DICIEMBRE, DE EMPLEO PÚBLICO VASCO, LA JORNADA DE TRABAJO:", "opciones": {"A": "Es el tiempo durante el cual el personal empleado público debe permanecer en el trabajo a disposición de la entidad correspondiente y en el ejercicio de su actividad y de sus funciones.", "B": "Fijará la forma de desempeñar el trabajo por el empleado público.", "C": "Podrá ser aplicada por las administraciones públicas vascas sin previa negociación colectiva al efecto.", "D": "Todas las anteriores son incorrectas."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Ley 11/2022, de 1 de diciembre, de Empleo Público Vasco", "articulo": "Estatuto y régimen disciplinario del personal empleado público vasco", "explicacion": "Respuesta oficial de la plantilla de corrección: Opción A) \"Es el tiempo durante el cual el personal empleado público debe permanecer en el trabajo a disposición de la entidad correspondiente y en el ejercicio de su actividad y de sus funciones.\"."}}, {"numero": 181, "tema_id": 6, "tema_title": "Tema 6: Ley 11/2022 de Empleo Público Vasco. Retribuciones, derechos, deberes, incompatibilidades y régimen disciplinario", "origen": "Batería Oficial Ayuntamiento de Bilbao - Temario General (Pregunta #181)", "estado": "Vigente", "pregunta": "DE ACUERDO CON EL ARTÍCULO 166 DE LA LEY 11/2022, DE 1 DE DICIEMBRE, DE EMPLEO PÚBLICO VASCO, LA ACTUACION PROFESIONAL DEL PERSONAL EMPLEADO PÚBLICO VASCO SE LLEVARÁ A CABO DESDE EL RESPETO:", "opciones": {"A": "A los principios de integridad y transparencia y con plena observancia de los principios de conducta individual, de calidad institucional y de relación con la ciudadanía recogidos en los artículos 6, 7 y 8 de la Ley 1/2014, de 26 de junio, Reguladora del C ódigo de Conducta y de los Conflictos de Intereses de los Cargos Públicos.", "B": "A los principios de imparcialidad y buena fe y con plena observancia de los principios de conducta colectiva, de calidad institucional y de relación con la ciudadanía recogidos en los artículos 6, 7 y 8 de la Ley 1/2014, de 26 de junio, Reguladora del Código de Conducta y de los Conflictos de Intereses de los Cargos Públicos.", "C": "A los principios de integridad y transparencia y con plena observancia de los principios de conducta individual y colectiva, de calidad institucional y de relación con la ciudadanía recogidos en los artículos 6, 7 y 8 de la Ley 1/2014, de 26 de junio, Reguladora del Código de Conducta y de los Conflictos de Intereses de los Cargos Públicos.", "D": "A los principios de imparcialidad y buena fe y con plena observancia de los principios de conducta individual, de calidad institucional y de relación con la ciudadanía recogidos en los artículos 6, 7 y 8 de la Ley 1/2014, de 26 de junio, Reguladora del Cód igo de Conducta y de los Conflictos de Intereses de los Cargos Públicos."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Ley 11/2022, de 1 de diciembre, de Empleo Público Vasco", "articulo": "Estatuto y régimen disciplinario del personal empleado público vasco", "explicacion": "Respuesta oficial de la plantilla de corrección: Opción A) \"A los principios de integridad y transparencia y con plena observancia de los principios de conducta individual, de calidad institucional y de relación con la ciudadanía recogidos en los artículos 6, 7 y 8 de la Ley 1/2014, de 26 de junio, Reguladora del C ódigo de Conducta y de los Conflictos de Intereses de los Cargos Públicos.\"."}}, {"numero": 182, "tema_id": 6, "tema_title": "Tema 6: Ley 11/2022 de Empleo Público Vasco. Retribuciones, derechos, deberes, incompatibilidades y régimen disciplinario", "origen": "Batería Oficial Ayuntamiento de Bilbao - Temario General (Pregunta #182)", "estado": "Vigente", "pregunta": "DE CONFORMIDAD CON LO DISPUESTO EN EL ARTÍCULO 171 DE LA LEY 11/2022, DE 1 DE DICIEMBRE, DE EMPLEO PÚBLICO VASCO:", "opciones": {"A": "El personal empleado público vasco vendrá obligado a observar estrictamente el régimen de incompatibilidades establecido en la legislación vigente.", "B": "Podrán desempeñar cualquier actividad en el sector público o privado sin la previa y expresa evaluación y la correspondiente autorización de compatibilidad.", "C": "En ningún caso el personal empleado público vasco  podrá desempeñar una actividad en el sector público o privado.", "D": "En todo caso el personal empleado público vasco  podrá desempeñar una actividad en el sector público o privado."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Ley 11/2022, de 1 de diciembre, de Empleo Público Vasco", "articulo": "Estatuto y régimen disciplinario del personal empleado público vasco", "explicacion": "Respuesta oficial de la plantilla de corrección: Opción A) \"El personal empleado público vasco vendrá obligado a observar estrictamente el régimen de incompatibilidades establecido en la legislación vigente.\"."}}, {"numero": 183, "tema_id": 6, "tema_title": "Tema 6: Ley 11/2022 de Empleo Público Vasco. Retribuciones, derechos, deberes, incompatibilidades y régimen disciplinario", "origen": "Batería Oficial Ayuntamiento de Bilbao - Temario General (Pregunta #183)", "estado": "Vigente", "pregunta": "DE ACUERDO CON EL ARTÍCULO 120 DE LA LEY 11/2022, DE 1 DE DICIEMBRE, DE EMPLEO PÚBLICO VASCO, LAS ADMINISTRACIONES PÚBLICAS VASCAS RETRIBUIRÁN A SU PERS  de Datos (RGPD 2016/679)", "origen": "Batería Oficial Ayuntamiento de Bilbao - Temario General (Pregunta #284)", "estado": "Vigente", "pregunta": "SEGÚN EL REGLAMENTO (UE) 2016/679 EL TRATAMIENTO SERÁ LÍCITO SI:", "opciones": {"A": "El interesado dio su consentimiento para el tratamiento de sus datos personales para uno o varios fines específicos.", "B": "El tratamiento es necesario para el cumplimiento de una obligación legal aplicable al responsable del tratamiento.", "C": "El interesado dio su consentimiento para el tratamiento de sus datos personales para uno o varios fines inespecíficos.", "D": "Las respuestas a) y b) son correctas."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Reglamento (UE) 2016/679 (RGPD) y Ley Orgánica 3/2018 (LOPDGDD)", "articulo": "Principios, derechos digitales y garantías en el tratamiento de datos personales", "explicacion": "Respuesta oficial de la plantilla de corrección: Opción D) \"Las respuestas a) y b) son correctas.\"."}}, {"numero": 285, "tema_id": 9, "tema_title": "Tema 9: Ley Orgánica 3/2018 (LOPDGDD) y Reglamento General de Protección de Datos (RGPD 2016/679)", "origen": "Batería Oficial Ayuntamiento de Bilbao - Temario General (Pregunta #285)", "estado": "Vigente", "pregunta": "DE ACUERDO CON EL REGLAMENTO (UE) 2016/679:", "opciones": {"A": "El interesado tendrá derecho a retirar su consentimiento en cualquier momento a partir del día siguiente al que lo prestó.", "B": "La retirada del consentimiento no afectará a la licitud del tratamiento basada en el consentimiento previo a su retirada, a no ser que dicho consentimiento versará sobre datos relativos a la salud o ideología.", "C": "Cuando el tratamiento se base en el consentimiento del interesado, el responsable deberá ser capaz de demostrar que aquel consintió el tratamiento de sus datos personales.", "D": "Será tan fácil retirar el consentimiento como darlo, salvo si el responsable del fichero está domiciliado en un Es  LA IGUALDAD DE MUJERES Y HOMBRES Y VIDAS LIBRES DE VIOLENCIA MACHISTA CONTRA LAS MUJERES, LA PRESENTE LEY TIENE POR OBJETO:", "opciones": {"A": "Establecer los principios generales que han de presidir la actuación de los poderes públicos, así como regular un conjunto de medidas dirigidas a promover y garantizar la igualdad de oportunidades y trato de mujeres y hombres en todos los ámbitos de la vida.", "B": "En particular, a promover el empoderamiento de las mujeres, su autonomía y el fortalecimiento de su posición social, económica y política al objeto de eliminar la desigualdad estructural y todas las formas de discriminación por razón de sexo.", "C": "Todo ello con el fin último de lograr una sociedad igualitaria y libre de violencia machista en la que todas las personas sean libres para desarrollar sus capacidades personales y tomar decisiones.", "D": "Todas las respuestas son correctas."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Decreto Legislativo 1/2023, de 16 de marzo, y V Plan Municipal de Igualdad del Ayuntamiento de Bilbao", "articulo": "Políticas de igualdad de género y vidas libres de violencia machista", "explicacion": "Respuesta oficial de la plantilla de corrección: Opción D) \"Todas las respuestas son correctas.\"."}}, {"numero": 319, "tema_id": 10, "tema_title": "Tema 10: Decreto Legislativo 1/2023 de Igualdad de Mujeres y Hombres y V Plan Municipal del Ayuntamiento de Bilbao", "origen": "Batería Oficial Ayuntamiento de Bilbao - Temario General (Pregunta #319)", "estado": "Vigente", "pregunta": "EL DECRETO LEGISLATIVO 1/2023, POR EL QUE SE APRUEBA EL TEXTO REFUNDIDO DE LA LEY PARA LA IGUALDAD DE MUJERES Y HOMBRES Y VIDAS LIBRES DE VIOLENCIA MACHISTA CONTRA LAS MUJERES, ENTRARÁ EN VIGOR:", "opciones": {"A": "Al día siguiente de su publicación en el Boletín Oficial del Estado.", "B": "Al día siguiente de su publicación en el Boletín Oficial del País Vasco.", "C": "A los veinte días de su completa ma_id": 10, "tema_title": "Tema 10: Decreto Legislativo 1/2023 de Igualdad de Mujeres y Hombres y V Plan Municipal del Ayuntamiento de Bilbao", "origen": "Batería Oficial Ayuntamiento de Bilbao - Temario General (Pregunta #321)", "estado": "Vigente", "pregunta": "SEGÚN EL ARTÍCULO 3 DEL DECRETO LEGISLATIVO 1/2023, POR EL QUE SE APRUEBA EL TEXTO REFUNDIDO DE LA LEY PARA LA IGUALDAD DE MUJERES Y HOMBRES Y VIDAS LIBRES DE VIOLENCIA MACHISTA CONTRA LAS MUJERES, LOS PRINCIPIOS GENERALES QUE DEBEN REGIR Y ORIENTAR LA ACTUACIÓN DE LOS PODERES PÚBLICOS VASCOS EN MATERIA DE IGUALDAD DE MUJERES Y HOMBRES SON:", "opciones": {"A": "La igualdad de trato e integración de la perspectiva de género.", "B": "La igualdad de oportunidades.", "C": "La colaboración y coordinación e internacionalización.", "D": "Todas las respuestas son correctas."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Decreto Legislativo 1/2023, de 16 de marzo, y V Plan Municipal de Igualdad del Ayuntamiento de Bilbao", "articulo": "Políticas de igualdad de género y vidas libres de violencia machista", "explicacion": "Respuesta oficial de la plantilla de corrección: Opción D) \"Todas las respuestas son correctas.\"."}}, {"numero": 322, "tema_id": 10, "tema_title": "Tema 10: Decreto Legislativo 1/2023 de Igualdad de Mujeres y Hombres y V Plan Municipal del Ayuntamiento de Bilbao", "origen": "Batería Oficial Ayuntamiento de Bilbao - Temario General (Pregunta #322)", "estado": "Vigente", "pregunta": "SEGÚN EL DECRETO LEGISLATIVO 1/2023, POR EL QUE SE APRUEBA EL TEXTO REFUNDIDO DE LA LEY PARA LA IGUALDAD DE MUJERES Y HOMBRES Y VIDAS LIBRES DE VIOLENCIA MACHISTA CONTRA LAS MUJERES, EXISTIRÁ DISCRIMINACIÓN DIRECTA:", "opciones": {"A": "Cuando una persona sea, haya sido o pudiera ser tratada de manera más favorable que otra en situación análoga por razón de su sexo o de circunstancias directamente relacionadas con el sexo.", "B": "Cuando una persona sea, haya sido o pudiera ser tratada de manera menos favorable que otra en situación análoga por razón de su sexo o de circunstancias directamente relacionadas con el sexo, como el embarazo o la maternidad.", "C": "Cuando una persona sea, haya sido o pudiera ser tratada de manera menos favorable que otra en situación análoga por razón de su sexo o de circunstancias no relacionadas con el sexo, como el embarazo o la maternidad.", "D": "Ninguna de las respuestas es correcta."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Decreto Legislativo 1/2023, de 16 de marzo, y V Plan Municipal de Igualdad del Ayuntamiento de Bilbao", "articulo": "Políticas de igualdad de género y vidas libres de violencia machista", "explicacion": "Respuesta oficial de la plantilla de corrección: Opción B) \"Cuando una persona sea, haya sido o pudiera ser tratada de manera menos favorable que otra en situación análoga por razón de su sexo o de circunstancias directamente relacionadas con el sexo, como el embarazo o la maternidad.\"."}}, {"numero": 323, "tema_id": 10, "tema_title": "Tema 10: Decreto Legislativo 1/2023 de Igualdad de Mujeres y Hombres y V Plan Municipal del Ayuntamiento de Bilbao", "origen": "Batería Oficial Ayuntamiento de Bilbao - Temario General (Pregunta #323)", "estado": "Vigente", "pregunta": "SEGÚN EL DECRETO LEGISLATIVO 1/2023, POR EL QUE SE APRUEBA EL TEXTO REFUNDIDO DE LA LEY PARA LA IGUALDAD DE MUJERES Y HOMBRES Y VIDAS LIBRES DE VIOLENCIA MACHISTA CONTRA LAS MUJERES, NO SE CONSIDERARÁN CONSTITUTIVAS DE DISCRIMINACIÓN POR RAZÓN DE SEXO:", "opciones": {"A": "Las medidas que, aunque planteen un tratamiento diferente para las mujeres y hombres, no tienen una justificación objetiva y razonable.", "B": "Las medidas que, aunque planteen un tratamiento igualitario para las mujeres y hombres, tienen una justificación objetiva y razonable.", "C": "Las medidas que, aunque planteen un tratamiento diferente para las mujeres y hombres, tienen una justificación objetiva y razonable.", "D": "Todas las respuestas son correctas."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Decreto Legislativo 1/2023, de 16 de marzo, y V Plan Municipal de Igualdad del Ayuntamiento de Bilbao", "articulo": "Políticas de igualdad de género y vidas libres de violencia machista", "explicacion": "Respuesta oficial de la plantilla de corrección: Opción C) \"Las medidas que, aunque planteen un tratamiento diferente para las mujeres y hombres, tienen una justificación objetiva y razonable.\"."}}, {"numero": 324, "tema_id": 10, "tema_title": "Tema 10: Decreto Legislativo 1/2023 de Igualdad de Mujeres y Hombres y V Plan Municipal del Ayuntamiento de Bilbao", "origen": "Batería Oficial Ayuntamiento de Bilbao - Temario General (Pregunta #324)", "estado": "Vigente", "pregunta": "SEGÚN EL DECRETO LEGISLATIVO 1/2023, POR EL QUE SE APRUEBA EL TEXTO REFUNDIDO DE LA LEY PARA LA IGUALDAD DE MUJERES Y HOMBRES Y VIDAS LIBRES DE VIOLENCIA MACHISTA CONTRA LAS MUJERES, PARA PROMOVER LA CONSECUCIÓN DE LA IGUALDAD REAL Y EFECTIVA DE MUJERES Y HOMBRES, LOS PODERES PÚBLICOS DEBEN:", "opciones": {"A": "Adoptar medidas específicas y temporales destinadas a eliminar o reducir las desigualdades de hecho por razón de sexo existentes en los diferentes ámbitos de la vida.", "B": "Adoptar medidas destinadas a eliminar las desigualdades existentes en el mundo del derecho por razón de sexo en los diferentes ámbitos de la vida.", "C": "Adoptar medidas destinadas a favorecer la igualdad jurídica de las personas eliminando las desigualdades existentes por razón de sexo.", "D": "Ninguna de las respuestas es correcta."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Decreto Legislativo 1/2023, de 16 de marzo, y V Plan Municipal de Igualdad del Ayuntamiento de Bilbao", "articulo": "Políticas de igualdad de género y vidas libres de violencia machista", "explicacion": "Respuesta oficial d al de la plantilla de corrección: Opción C) \"La Directora de Emakunde.\"."}}, {"numero": 332, "tema_id": 10, "tema_title": "Tema 10: Decreto Legislativo 1/2023 de Igualdad de Mujeres y Hombres y V Plan Municipal del Ayuntamiento de Bilbao", "origen": "Batería Oficial Ayuntamiento de Bilbao - Temario General (Pregunta #332)", "estado": "Vigente", "pregunta": "SEGÚN EL ARTÍCULO 16 DEL DECRETO LEGISLATIVO 1/2023, POR EL QUE SE APRUEBA EL TEXTO REFUNDIDO DE LA LEY PARA LA IGUALDAD DE MUJERES Y HOMBRES Y VIDAS LIBRES DE VIOLENCIA MACHISTA CONTRA LAS MUJERES, LOS PLANES PARA LA IGUALDAD DE LOS AYUNTAMIENTOS NO ES NECESARIO QUE DISPONGAN DE:", "opciones": {"A": "Diagnóstico de situación.", "B": "Régimen sancionador.", "C": "Presupuesto.", "D": "Calendario."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Decreto Legislativo 1/2023, de 16 de marzo, y V Plan Municipal de Igualdad del Ayuntamiento de Bilbao", "articulo": "Políticas de igualdad de género y vidas libres de violencia machista", "explicacion": "Respuesta oficial de la plantilla de corrección: Opción B) \"Régimen sancionador.\"."}}, {"numero": 333, "tema_id": 10, "tema_title": "Tema 10: Decreto Legislativo 1/2023 de Igualdad de Mujeres y Hombres y V Plan Municipal del Ayuntamiento de Bilbao", "origen": "Batería Oficial Ayuntamiento de Bilbao - Temario General (Pregunta #333)", "estado": "Vigente", "pregunta": "SEGÚN EL ARTÍCULO 21 DEL DECRETO LEGISLATIVO 1/2023, POR EL QUE SE APRUEBA EL TEXTO REFUNDIDO DE LA LEY PARA LA IGUALDAD DE MUJERES Y HOMBRES Y VIDAS LIBRES DE VIOLENCIA MACHISTA CONTRA LAS MUJERES, LOS PROCESOS SELECTIVOS DE ACCESO, PROVISIÓN Y PROMOCIÓN EN EL EMPLEO PÚBLICO DEBEN INCLUIR:", "opciones": {"A": "Una cláusula por la que, en caso de existir igualdad de capacitación, se dé prioridad a las mujeres en aquellos cuerpos, escalas, niveles y categorías de la Administración en los que la representación de éstas sea inferior al 20%.", "B": "Una cláusula por la que, en caso de existir igualdad de capacitación, se dé prioridad a las mujeres en aquellos cuerpos, escalas, niveles y categorías de la Administración en los que la representación de éstas sea inferior al 30%.", "C": "Una cláusula por la que, en caso de existir igualdad de capacitación, se dé prioridad a las mujeres en aquellos cuerpos, escalas, niveles y categorías de la Administración en los que la representación de éstas sea inferior al 40%.", "D": "Ninguna de las respuestas es correcta."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Decreto Legislativo 1/2023, de 16 de marzo, y V Plan Municipal de Igualdad del Ayuntamiento de Bilbao", "articulo": "Políticas de igualdad de género y vidas libres de violencia machista", "explicacion": "Respuesta oficial de la plantilla de corrección: Opción C) \"Una cláusula por la que, en caso de existir igualdad de capacitación, se dé prioridad a las mujeres en aquellos cuerpos, escalas, niveles y categorías de la Administración en los que la representación de éstas sea inferior al 40%.\"."}}, {"numero": 334, "tema_id": 10, "tema_title": "Tema 10: Decreto Legislativo 1/2023 de Igualdad de Mujeres y Hombres y V Plan Municipal del Ayuntamiento de Bilbao", "origen": "Batería Oficial Ayuntamiento de Bilbao - Temario General (Pregunta #334)", "estado": "Vigente", "pregunta": "SEGÚN EL DECRETO LEGISLATIVO 1/2023, POR EL QUE SE APRUEBA EL TEXTO REFUNDIDO DE LA LEY PARA LA IGUALDAD DE MUJERES Y HOMBRES Y VIDAS LIBRES DE VIOLENCIA MACHISTA CONTRA LAS MUJERES, LOS PROYECTOS DE NORMAS QUE SE ELABOREN EN EL ÁMBITO DE LA ADMINISTRACIÓN  DE LA COMUNIDAD AUTÓNOMA HAN DE SER INFORMADOS POR:", "opciones": {"A": "El Ararteko.", "B": "La Consejería de Empleo y Políticas Sociales.", "C": "La Comisión Interinstitucional para la Igualdad de Mujeres y Hombres.", "D": "Emakunde Instituto Vasco de la Mujer."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Decreto Legislativo 1/2023, de 16 de marzo, y V Plan Municipal de Igualdad del Ayuntamiento de Bilbao", "articulo": "Políticas de igualdad de género y vidas libres de violencia machista", "explicacion": "Respuesta oficial de la plantilla de corrección: Opción D) \"Emakunde Instituto Vasco de la Mujer.\"."}}, {"numero": 335, "tema_id": 10, "tema_title": "Tema 10: Decreto Legislativo 1/2023 de Igualdad de Mujeres y Hombres y V Plan Municipal del Ayuntamiento de Bilbao", "origen": "Batería Oficial Ayuntamiento de Bilbao - Temario General (Pregunta #335)", "estado": "Vigente", "pregunta": "SEGÚN EL ARTÍCULO 47 DEL DECRETO LEGISLATIVO 1/2023, POR EL QUE SE APRUEBA EL TEXTO REFUNDIDO DE LA LEY PARA LA IGUALDAD DE MUJERES Y HOMBRES Y VIDAS LIBRES DE VIOLENCIA MACHISTA CONTRA LAS MUJERES, RELATIVO AL ACOSO POR RAZÓN DE SEXO… (MARCAR LA RESPUESTA INCORRECTA):", "opciones": {"A": "Se considera acoso por razón de sexo en el trabajo cualquier comportamiento verbal, no verbal o físico no deseado, que se produzca en el ámbito o con ocasión de las relaciones de trabajo, dirigido contra una persona por razón de su sexo y con el propósito o el efecto de atentar contra la dignidad de una persona o de crear un entorno intimidatorio, hostil, degradante, humillante u ofensivo.", "B": "Se considera acoso por razón de sexo en el trabajo cualquier comportamiento de índole sexual verbal, no verbal o físico no deseado dirigido contra una persona , que se produzca en el ámbito de las relaciones personales.", "C": "El acoso por razón de sexo tendrá la consideración de falta disciplinaria muy grave para el personal funcionario de las administraciones públicas vascas.", "D": "Las administraciones públicas vascas, en el ámbito de sus competencias, han de garantizar a las víctimas de acoso sexual y de acoso por razón de sexo el derecho a una atención integral, gratuita, accesible y de calidad que responda a sus necesidades derivadas de dichas situaciones de violencia."}, "respuesta_correcta": "B                 const ans = examAnswers[q.numero];
                if (!ans) blank++;
                else if (ans === q.respuesta_correcta) correct++;
                else wrong++;
              });
              const finalScore = Math.max(0, correct - (wrong / 3)).toFixed(2);
              const maxScore = examQuestions.length;
              const percentage = Math.round((finalScore / maxScore) * 100);

              return React.createElement(
                "div",
                { className: "bg-white dark:bg-slate-800 rounded-2xl p-8 border border-slate-200 dark:border-slate-700 shadow-sm space-y-6 text-center" },
                React.createElement("div", { className: "w-16 h-16 mx-auto rounded-2xl bg-blue-100 dark:bg-blue-950 flex items-center justify-center text-3xl" }, "🏆"),
                React.createElement(
                  "div",
                  null,
                  React.createElement("h2", { className: "text-2xl font-bold text-slate-900 dark:text-white" }, "Resultados del Examen"),
                  React.createElement("p", { className: "text-sm text-slate-500 dark:text-slate-400 mt-1" }, "Simulacro de 50 preguntas aleatorias de la OPE Bilbao")
                ),
                React.createElement(
                  "div",
                  { className: "grid grid-cols-3 gap-4 max-w-md mx-auto" },
                  React.createElement(
                    "div",
                    { className: "p-4 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800" },
                    React.createElement("div", { className: "text-2xl font-extrabold text-emerald-600 dark:text-emerald-400" }, correct),
                    React.createElement("div", { className: "text-xs text-emerald-700 dark:text-emerald-300 font-semibold mt-1" }, "Aciertos (+1)")
                  ),
                  React.createElement(
                    "div",
                    { className: "p-4 rounded-xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800" },
                    React.createElement("div", { className: "text-2xl font-extrabold text-rose-600 dark:text-rose-400" }, wrong),
                    React.createElement("div", { className: "text-xs text-rose-700 dark:text-rose-300 font-semibold mt-1" }, "Fallos (-0.33)")
                  ),
                  React.createElement(
                    "div",
                    { className: "p-4 rounded-xl bg-slate-50 dark:bg-slate-700/40 border border-slate-200 dark:border-slate-700" },
                    React.createElement("div", { className: "text-2xl font-extrabold text-slate-600 dark:text-slate-400" }, blank),
                    React.createElement("div", { className: "text-xs text-slate-600 dark:text-slate-400 font-semibold mt-1" }, "En Blanco (0)")
                  )
                ),
                React.createElement(
                  "div",
                  { className: "p-6 rounded-2xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 max-w-sm mx-auto" },
                  React.createElement("div", { className: "text-xs font-bold text-slate-500 uppercase tracking-wider" }, "Nota Neta Oficial"),
                  React.createElement(
                    "div",
                    { className: "text-4xl font-black text-slate-900 dark:text-white mt-1" },
                    finalScore,
                    React.createElement("span", { className: "text-base font-normal text-slate-400" }, ` / ${maxScore}`)
                  ),
                  React.createElement(
                    "div",
                    { className: `text-xs font-semibold mt-2 ${percentage >= 50 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}` },
                    `${percentage >= 50 ? '¡APROBADO!' : 'NO SUPERADO'} (${percentage}%)`
                  )
                ),
                React.createElement(
                  "div",
                  { className: "flex justify-center gap-3 pt-4" },
                  React.createElement(
                    "button",
                    {
                      onClick: () => startExam(50),
                      className: "px-5 py-2.5 rounded-xl text-xs font-bold bg-blue-600 hover:bg-blue-700 text-white shadow-sm"
                    },
                    "Repetir otro examen"
                  ),
                  React.createElement(
                    "button",
                    {
                      onClick: () => setMode('study'),
                      className: "px-5 py-2.5 rounded-xl text-xs font-bold border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700"
                    },
                    "Volver a Práctica"
                  )
                )
              );
            })()
          ),

          // MODE: SEARCH / EXPLORADOR
          mode === 'search' && React.createElement(
            "div",
            { className: "space-y-4" },
            React.createElement(
              "div",
              { className: "bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col sm:flex-row gap-3" },
              React.createElement("input", {
                type: "text",
                placeholder: "Buscar por texto de pregunta, ley, artículo o número...",
                value: searchQuery,
                onChange: (e) => setSearchQuery(e.target.value),
                className: "flex-1 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 px-4 py-2.5 focus:ring-2 focus:ring-blue-500"
              }),
              React.createElement(
                "select",
                {
                  value: selectedTema,
                  onChange: (e) => setSelectedTema(e.target.value),
                  className: "text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 px-3 py-2.5"
                },
                React.createElement("option", { value: "all" }, "Todos los temas"),
                temasList.map(([tid, title]) =>
                  React.createElement("option", { key: tid, value: tid }, title)
                )
              )
            ),
            React.createElement(
              "div",
              { className: "text-xs text-slate-500 px-1 font-semibold" },
              `Mostrando ${filteredQuestions.length} de 630 preguntas`
            ),
            React.createElement(
              "div",
              { className: "space-y-3" },
              filteredQuestions.slice(0, 50).map(q =>
                React.createElement(
                  "div",
                  { key: q.numero, className: "bg-white dark:bg-slate-800 rounded-xl p-5 border border-slate-200 dark:border-slate-700 shadow-sm space-y-2" },
                  React.createElement(
                    "div",
                    { className: "flex items-center justify-between text-xs" },
                    React.createElement("span", { className: "font-bold text-blue-600 dark:text-blue-400" }, `Pregunta #${q.numero} · ${q.tema_title}`),
                    React.createElement("span", { className: "font-bold px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-700 text-slate-800 dark:text-slate-200" }, `Respuesta: ${q.respuesta_correcta}`)
                  ),
                  React.createElement("div", { className: "text-sm font-semibold text-slate-900 dark:text-white" }, q.pregunta),
                  React.createElement(
                    "div",
                    { className: "text-xs text-slate-600 dark:text-slate-300 pt-2 border-t border-slate-100 dark:border-slate-700/60" },
                    React.createElement("strong", null, "Normativa: "),
                    `${q.fundamento_juridico.norma} (${q.fundamento_juridico.articulo}). `,
                    React.createElement("em", null, `"${q.fundamento_juridico.explicacion}"`)
                  )
                )
              ),
              filteredQuestions.length > 50 && React.createElement(
                "div",
                { className: "text-center py-4 text-xs text-slate-400" },
                "Mostrando las primeras 50 preguntas. Refina tu búsqueda para ver más."
              )
            )
          ),

          // MODE: STATS / ESTADÍSTICAS
          mode === 'stats' && React.createElement(
            "div",
            { className: "max-w-3xl mx-auto bg-white dark:bg-slate-800 rounded-2xl p-8 border border-slate-200 dark:border-slate-700 shadow-sm space-y-6" },
            React.createElement(
              "h2",
              { className: "text-xl font-bold text-slate-900 dark:text-white flex items-center gap-2" },
              React.createElement("span", null, "📊"),
              " Estadísticas de Rendimiento"
            ),
            React.createElement(
              "div",
              { className: "grid grid-cols-2 sm:grid-cols-4 gap-4" },
              React.createElement(
                "div",
                { className: "p-4 rounded-xl bg-slate-50 dark:bg-slate-750 border border-slate-100 dark:border-slate-700 text-center" },
                React.createElement("div", { className: "text-2xl font-black text-slate-900 dark:text-white" }, totalAnswered),
                React.createElement("div", { className: "text-xs text-slate-500 mt-1" }, "Respondidas")
              ),
              React.createElement(
                "div",
                { className: "p-4 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-100 dark:border-emerald-800 text-center" },
                React.createElement("div", { className: "text-2xl font-black text-emerald-600 dark:text-emerald-400" }, totalCorrect),
                React.createElement("div", { className: "text-xs text-emerald-600 mt-1" }, "Aciertos")
              ),
              React.createElement(
                "div",
                { className: "p-4 rounded-xl bg-rose-50 dark:bg-rose-950/40 border border-rose-100 dark:border-rose-800 text-center" },
                React.createElement("div", { className: "text-2xl font-black text-rose-600 dark:text-rose-400" }, Math.max(0, totalAnswered - totalCorrect)),
                React.createElement("div", { className: "text-xs text-rose-600 mt-1" }, "Fallos")
              ),
              React.createElement(
                "div",
                { className: "p-4 rounded-xl bg-blue-50 dark:bg-blue-950/40 border border-blue-100 dark:border-blue-800 text-center" },
                React.createElement("div", { className: "text-2xl font-black text-blue-600 dark:text-blue-400" }, `${accuracyRate}%`),
                React.createElement("div", { className: "text-xs text-blue-600 mt-1" }, "Tasa de Acierto")
              )
            ),
            React.createElement(
              "div",
              { className: "pt-4 border-t border-slate-100 dark:border-slate-700 flex justify-between items-center" },
              React.createElement(
                "span",
                { className: "text-xs text-slate-500" },
                "Preguntas guardadas en Favoritos: ",
                React.createElement("strong", null, favorites.length)
              ),
              React.createElement(
                "button",
                {
                  onClick: () => {
                    if (confirm("¿Deseas reiniciar todas tus estadísticas locales de práctica?")) {
                      setAnswersHistory({});
                      localStorage.removeItem('ope_bilbao_answers_v1');
                    }
                  },
                  className: "text-xs text-rose-600 hover:text-rose-700 font-semibold"
                },
                "Reiniciar estadísticas"
              )
            )
          )
        ),

        // Footer
        React.createElement(
          "footer",
          { className: "bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 py-6 text-center text-xs text-slate-500 dark:text-slate-400" },
          React.createElement("p", null, "Ayuntamiento de Bilbao · Batería Oficial de Preguntas Tipo Test (Parte General)"),
          React.createElement(
            "p",
            { className: "mt-1" },
            "630 preguntas oficiales · 18 temas · 5ª edición oficial"
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      React.createElement(App, null)
    );
  </script>
</body>
</html>
